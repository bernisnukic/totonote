<!doctype html>
<meta charset="utf-8" />
<title>TotoNote</title>
<style>
  /* A splash window: no frame, no chrome, nothing behind it. The rounded corners are
     drawn here because the window itself is transparent and frameless. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    cursor: default;
  }
  /* Opaque from the first paint, and never faded. Fading the card itself made the whole
     window see-through at the start — the window *is* transparent, so what showed through
     was whatever happened to be behind it, reported as "a white border instead of all
     black". Only the contents fade; the black is there from the beginning. */
  .splash {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Pure black, because the mark's own background is — anything lighter draws a
       visible square around the logo. */
    background: #000;
    border: 1px solid #262626;
    border-radius: 12px;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, monospace;
  }
  .contents {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    animation: fade-in 450ms ease-out forwards;
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  /* Square, and stated, so swapping the still for the animation shifts nothing. */
  img { width: 120px; height: 120px; }
  .name {
    color: #e0e0e0;
    font-size: 15px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .version { color: #666; font-size: 11px; letter-spacing: 0.08em; }
  .bar {
    width: 180px;
    height: 2px;
    border-radius: 2px;
    background: #232323;
    overflow: hidden;
  }
  /* Indeterminate progress — it says "starting", it does not claim to measure anything. */
  .bar span {
    display: block;
    width: 40%;
    height: 100%;
    background: #48dbfb;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar span { animation: none; width: 100%; opacity: 0.5; }
    .contents { animation: none; opacity: 1; }
  }
</style>
<div class="splash" onclick="window.close()" title="Click to skip">
  <div class="contents" id="contents">
    <!-- The still of frame 1, so the fade arrives *at* the first frame rather than at an
         empty box. Swapped for the animation once the fade is done. -->
    <img id="mark" src="intro-first.png" alt="" width="120" height="120" />
    <div class="name">TotoNote</div>
    <div class="version" id="version"></div>
    <div class="bar"><span></span></div>
  </div>
</div>
<script>
  // The version is passed in on the query string — the splash has no preload and no
  // access to the app, deliberately: it must never be able to delay startup.
  const v = new URLSearchParams(location.search).get('v');
  if (v) document.getElementById('version').textContent = 'Version ' + v;

  // black -> fade in to the first frame -> the animation plays -> it holds on the last
  // frame. A GIF starts the instant it has a source, so it is not put in place until the
  // fade has finished; until then the still stands in for it. Decoded up front, so the
  // swap starts frame 1 at once and shows no gap.
  const mark = document.getElementById('mark');
  const warm = new Image();
  warm.src = 'intro.gif';

  let started = false;
  const play = () => {
    if (started) return;
    started = true;
    mark.src = 'intro.gif';
  };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    play();
  } else {
    document.getElementById('contents').addEventListener('animationend', event => {
      if (event.animationName === 'fade-in') play();
    });
    // If the animation never reports finishing, play anyway: a splash stuck on a still
    // frame is worse than one that starts a moment early.
    setTimeout(play, 700);
  }
</script>
